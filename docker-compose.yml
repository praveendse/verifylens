# VerifyLens on an internal server. Full steps: DEPLOY.md
#
#   docker compose up -d --build
#   docker compose exec app python -m scripts.bootstrap_admin --username admin   # first run only
services:
  app:
    build: .
    image: verifylens:latest
    container_name: verifylens
    restart: unless-stopped
    ports:
      # Only reachable from this machine; put the internal reverse proxy /
      # VPN in front. Change to "8000:8000" only on an isolated network.
      - "127.0.0.1:8000:8000"
    environment:
      # Optional overrides (defaults in app/config/settings.py):
      # GEMINI_MODEL: gemini-3.5-flash-lite
      # SEARCHES_PER_USER_PER_MINUTE: "5"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    # Read by the app from /run/secrets/<name> (security/secrets.py).
    # The files live on the server, outside the repo and the image.
    secrets:
      - jwt_secret_key
      - gemini_api_key
    volumes:
      - verifylens-data:/data
      - ${BACKUP_DIR:-./backups}:/backups
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: "1gb"
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true

secrets:
  jwt_secret_key:
    file: ${SECRETS_PATH:-/etc/verifylens}/jwt_secret_key
  gemini_api_key:
    file: ${SECRETS_PATH:-/etc/verifylens}/gemini_api_key

volumes:
  verifylens-data:
