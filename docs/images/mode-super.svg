<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="530" viewBox="0 0 1210 530" font-family="Noto Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="30" font-size="14" fill="#334155"><tspan font-weight="700" letter-spacing="0.8">SUPER MODE</tspan><tspan fill="#475569">  · switch on · API value "thorough" · 2 Gemini calls + label check</tspan></text><rect x="30" y="70" width="210" height="60" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/><text x="135.0" y="95.5" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Image</text><text x="135.0" y="114.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">lead image from Wikipedia</text><rect x="30" y="250" width="210" height="70" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/><text x="135.0" y="271.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Scraped details</text><text x="135.0" y="290.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">title · first paragraph</text><text x="135.0" y="309.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">infobox fields</text><rect x="30" y="390" width="210" height="70" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/><text x="135.0" y="411.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Image labels</text><text x="135.0" y="430.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">caption · alt text</text><text x="135.0" y="449.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">file name</text><rect x="330" y="60" width="230" height="80" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="445.0" y="95.5" font-size="14" font-weight="700" fill="#312e81" text-anchor="middle">Gemini call 1</text><text x="445.0" y="114.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">sees: image ONLY</text><rect x="650" y="60" width="230" height="80" rx="7" fill="#fffbeb" stroke="#a16207" stroke-width="1.5"/><text x="765.0" y="86.0" font-size="14" font-weight="700" fill="#713f12" text-anchor="middle">Blind description</text><text x="765.0" y="105.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">what the image shows</text><text x="765.0" y="124.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">(shown in the report)</text><rect x="650" y="225" width="230" height="120" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="765.0" y="261.5" font-size="14" font-weight="700" fill="#312e81" text-anchor="middle">Gemini call 2</text><text x="765.0" y="280.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">sees: image + details</text><text x="765.0" y="299.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">+ blind description</text><text x="765.0" y="318.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">decides the match</text><rect x="650" y="395" width="230" height="80" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="765.0" y="421.0" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">Label check (code, no AI)</text><text x="765.0" y="440.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">do the labels contain</text><text x="765.0" y="459.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">a title word?</text><rect x="980" y="205" width="200" height="60" rx="7" fill="#fffbeb" stroke="#a16207" stroke-width="1.5"/><text x="1080.0" y="230.5" font-size="14" font-weight="700" fill="#713f12" text-anchor="middle">Reason</text><text x="1080.0" y="249.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">why it does or doesn't match</text><rect x="980" y="290" width="200" height="60" rx="7" fill="#fffbeb" stroke="#a16207" stroke-width="1.5"/><text x="1080.0" y="315.5" font-size="14" font-weight="700" fill="#713f12" text-anchor="middle">PASS / FAIL</text><text x="1080.0" y="334.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">the verdict (never changed)</text><rect x="980" y="395" width="200" height="80" rx="7" fill="#fffbeb" stroke="#a16207" stroke-width="1.5"/><text x="1080.0" y="421.0" font-size="14" font-weight="700" fill="#713f12" text-anchor="middle">Needs review</text><text x="1080.0" y="440.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">only if the label check</text><text x="1080.0" y="459.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">and the verdict disagree</text><path d="M 240 100 L 326 100" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><path d="M 285 100 L 285 255 L 646 255" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><text x="300" y="249" font-size="12.5" fill="#334155" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="5">image</text><path d="M 240 285 L 646 285" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><text x="440" y="279" font-size="12.5" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">details</text><path d="M 560 100 L 646 100" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><path d="M 765 140 L 765 221" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><text x="775" y="186" font-size="12.5" fill="#334155" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="5">blind description</text><path d="M 240 425 L 646 425" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><text x="440" y="419" font-size="12.5" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">labels + title</text><path d="M 880 285 L 930 285 L 930 235 L 976 235" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><path d="M 930 285 L 930 320 L 976 320" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><path d="M 880 435 L 976 435" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><path d="M 1080 350 L 1080 391" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><text x="24" y="512" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Blue: Gemini calls.  Green: plain code.  Yellow: what the report shows.  The labels never reach Gemini, so the label check stays independent.</text></svg>