<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="330" viewBox="0 0 1010 330" font-family="Noto Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="30" font-size="14" fill="#334155"><tspan font-weight="700" letter-spacing="0.8">STANDARD MODE</tspan><tspan fill="#475569">  default (switch off), 1 Gemini call</tspan></text><rect x="30" y="70" width="210" height="60" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/><text x="135.0" y="95.5" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Image</text><text x="135.0" y="114.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">lead image from Wikipedia</text><rect x="30" y="190" width="210" height="70" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/><text x="135.0" y="211.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Scraped details</text><text x="135.0" y="230.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">title, first paragraph</text><text x="135.0" y="249.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">infobox fields</text><rect x="390" y="105" width="240" height="120" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="510.0" y="141.5" font-size="14" font-weight="700" fill="#312e81" text-anchor="middle">Gemini call</text><text x="510.0" y="160.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">sees: image + details</text><text x="510.0" y="179.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">describe the image, then</text><text x="510.0" y="198.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">decide if it shows the subject</text><path d="M 240 100 L 310 100 L 310 145 L 386 145" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><path d="M 240 225 L 310 225 L 310 185 L 386 185" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><rect x="760" y="55" width="220" height="60" rx="7" fill="#fffbeb" stroke="#a16207" stroke-width="1.5"/><text x="870.0" y="80.5" font-size="14" font-weight="700" fill="#713f12" text-anchor="middle">Description</text><text x="870.0" y="99.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">what the image shows</text><rect x="760" y="135" width="220" height="60" rx="7" fill="#fffbeb" stroke="#a16207" stroke-width="1.5"/><text x="870.0" y="160.5" font-size="14" font-weight="700" fill="#713f12" text-anchor="middle">Reason</text><text x="870.0" y="179.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">why it does or doesn't match</text><rect x="760" y="215" width="220" height="60" rx="7" fill="#fffbeb" stroke="#a16207" stroke-width="1.5"/><text x="870.0" y="240.5" font-size="14" font-weight="700" fill="#713f12" text-anchor="middle">PASS / FAIL</text><text x="870.0" y="259.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">the verdict</text><path d="M 630 165 L 700 165 L 700 85 L 756 85" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><path d="M 700 165 L 756 165" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><path d="M 700 165 L 700 245 L 756 245" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><text x="24" y="312" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Blue: Gemini call.  Yellow: what the report shows.  One request with the image and details together.</text></svg>