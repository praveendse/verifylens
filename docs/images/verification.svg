<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="650" viewBox="0 0 1450 650" font-family="Noto Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="230" width="230" height="190" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/><text x="135.0" y="282.5" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Scraped by Playwright</text><text x="135.0" y="301.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">article: title, paragraph,</text><text x="135.0" y="320.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">infobox fields</text><text x="135.0" y="339.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">lead image (file)</text><text x="135.0" y="358.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">image labels: caption,</text><text x="135.0" y="377.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">alt text, file name</text><rect x="330" y="20" width="690" height="160" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="346" y="42" font-size="13" fill="#334155"><tspan font-weight="700" letter-spacing="0.8">STANDARD MODE</tspan><tspan fill="#475569">  · default · 1 Gemini call</tspan></text><rect x="330" y="205" width="690" height="210" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="346" y="227" font-size="13" fill="#334155"><tspan font-weight="700" letter-spacing="0.8">SUPER MODE</tspan><tspan fill="#475569">  · API value "thorough" · 2 Gemini calls (≈ 2× time and cost)</tspan></text><rect x="330" y="440" width="690" height="160" rx="10" fill="#f7fdf9" stroke="#15803d" stroke-width="1.5"/><text x="346" y="462" font-size="13" fill="#14532d"><tspan font-weight="700" letter-spacing="0.8">LABEL CHECK</tspan><tspan fill="#475569">  · plain code, no AI · Super mode only</tspan></text><rect x="470" y="60" width="410" height="100" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="675.0" y="96.0" font-size="14" font-weight="700" fill="#312e81" text-anchor="middle">Gemini: verdict</text><text x="675.0" y="115.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">sees: image + article</text><text x="675.0" y="134.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">returns: description · reason · PASS/FAIL</text><rect x="360" y="248" width="290" height="140" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="505.0" y="294.5" font-size="14" font-weight="700" fill="#312e81" text-anchor="middle">Call 1: blind description</text><text x="505.0" y="313.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">sees: image only</text><text x="505.0" y="332.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">no article, no labels</text><text x="505.0" y="351.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">returns: description</text><rect x="700" y="248" width="300" height="140" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="850.0" y="294.5" font-size="14" font-weight="700" fill="#312e81" text-anchor="middle">Call 2: verdict</text><text x="850.0" y="313.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">sees: image + article</text><text x="850.0" y="332.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">+ the blind description</text><text x="850.0" y="351.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">returns: reason · PASS/FAIL</text><path d="M 650 318 L 696 318" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><rect x="360" y="480" width="640" height="100" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="680.0" y="525.5" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">Does the caption, alt text or file name contain a title word?</text><text x="680.0" y="544.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">agrees · unclear (no title word) · no labels</text><path d="M 250 325 L 290 325 L 290 110 L 466 110" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><text x="298" y="101" font-size="12.5" fill="#334155" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="5">standard</text><path d="M 250 325 L 290 325 L 290 318 L 356 318" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><text x="298" y="309" font-size="12.5" fill="#334155" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="5">super</text><path d="M 250 325 L 290 325 L 290 530 L 356 530" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><text x="298" y="521" font-size="12.5" fill="#334155" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="5">super</text><rect x="1110" y="150" width="320" height="380" rx="6" fill="#fffbeb" stroke="#a16207" stroke-width="1.5"/><text x="1270.0" y="221.5" font-size="14" font-weight="700" fill="#713f12" text-anchor="middle">Result</text><text x="1270.0" y="240.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle"></text><text x="1270.0" y="259.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">Verdict = Gemini PASS / FAIL</text><text x="1270.0" y="278.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">(the labels never change it)</text><text x="1270.0" y="297.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle"></text><text x="1270.0" y="316.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">Super mode: Needs review when</text><text x="1270.0" y="335.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">FAIL and labels agree, or</text><text x="1270.0" y="354.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">PASS and labels unclear</text><text x="1270.0" y="373.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle"></text><text x="1270.0" y="392.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">Standard: the original report,</text><text x="1270.0" y="411.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">no labels, no review flag</text><text x="1270.0" y="430.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle"></text><text x="1270.0" y="449.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">Saved: verification_mode;</text><text x="1270.0" y="468.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">super adds label_check, needs_review</text><path d="M 880 110 L 1060 110 L 1060 250 L 1106 250" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><text x="1060" y="102" font-size="12.5" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">verdict</text><path d="M 1000 318 L 1106 318" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><text x="1053" y="310" font-size="12.5" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">verdict</text><path d="M 1000 530 L 1060 530 L 1060 430 L 1106 430" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/><text x="20" y="632" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Blue: Gemini calls.  Green: plain code.  Arrows show what each step passes on; the arrow labels are the mode.  Mode: the Super mode switch on the Verify page; the API gets "mode": "standard" or "thorough".</text></svg>